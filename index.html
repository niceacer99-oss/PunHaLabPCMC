<!DOCTYPE html>
<html lang="th">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>น้องปันหา หาให้</title>
  <style>
    /* 100dvh หดตามแถบเครื่องมือเบราว์เซอร์จริง ต่างจาก 100vh ที่คงที่
       ทำให้ก้นของ iframe ไม่ถูกดันไปอยู่ใต้แถบเครื่องมือ */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #f6fbfb;
      overscroll-behavior: none;
    }
    #app {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }
    #app iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <!-- LIFF SDK — ต้องโหลดที่หน้านี้ ไม่ใช่ในหน้าที่อยู่ข้างใน iframe
       เพราะ LINE ยอมรับเฉพาะหน้าที่ URL ตรงกับ Endpoint URL ที่ตั้งไว้เท่านั้น -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <script>
    // ════════ สะพาน LIFF ════════
    // หน้าข้างในสั่งงานผ่าน postMessage เพราะคนละโดเมน เรียกฟังก์ชันข้ามกันไม่ได้
    (function () {
      var LIFF_ID = '2011666406-VnevGqdL';

      var ready = false;

      function reply(ok, why) {
        var f = document.querySelector('#app iframe');
        if (f && f.contentWindow) {
          f.contentWindow.postMessage({ t: 'liff-send-result', ok: !!ok, why: why || '' }, '*');
        }
      }

      if (LIFF_ID && window.liff) {
        try {
          liff.init({ liffId: LIFF_ID })
            .then(function () { ready = true; })
            .catch(function () { ready = false; });
        } catch (e) {}
      }

      window.addEventListener('message', function (ev) {
        // รับคำสั่งจากหน้าข้างในเท่านั้น
        if (!/^https:\/\/([a-z0-9-]+\.)*(googleusercontent|script\.google)\.com$/.test(ev.origin)) return;
        var d = ev.data;
        if (!d || d.t !== 'liff-send' || !d.text) return;

        if (!ready || !window.liff || !liff.isInClient || !liff.isInClient()) {
          reply(false, 'no-liff');
          return;
        }
        try {
          liff.sendMessages([{ type: 'text', text: String(d.text).slice(0, 4000) }])
            .then(function () {
              reply(true);
              setTimeout(function () { try { liff.closeWindow(); } catch (e) {} }, 150);
            })
            .catch(function (err) { reply(false, String(err && err.message || err)); });
        } catch (e) { reply(false, 'throw'); }
      });
    })();
  </script>

  <script>
    (function () {
      var BASE = 'https://script.google.com/macros/s/AKfycbwaEleCX7fF1WCig8avgDekRVysKy9g6vBBWNONMlI8Mw1-9k8UtsjlI0j0wNgcfLfs8A/exec';

      // ส่งต่อพารามิเตอร์จาก URL ของหน้านี้เข้าไปใน iframe
      // เช่น  pun-ha-lab-pcmc.vercel.app/?q=CBC  ->  .../exec?q=CBC
      // จำเป็นเพราะหน้าที่อยู่ใน iframe มองไม่เห็น URL ของหน้าแม่
      var ALLOWED = ['q', 'search', 'view', 'check', 'item', 'oa'];
      var src = BASE;

      try {
        var incoming = new URLSearchParams(window.location.search);
        var pass = [];
        for (var i = 0; i < ALLOWED.length; i++) {
          var key = ALLOWED[i];
          var val = incoming.get(key);
          if (val) pass.push(encodeURIComponent(key) + '=' + encodeURIComponent(val));
        }
        if (pass.length) src = BASE + '?' + pass.join('&');
      } catch (e) {}

      var frame = document.createElement('iframe');
      frame.src = src;
      frame.title = 'น้องปันหา หาให้';
      frame.setAttribute('scrolling', 'yes');
      frame.setAttribute('allow', 'clipboard-write');
      document.getElementById('app').appendChild(frame);

      // เบราว์เซอร์เก่าที่ยังไม่รู้จัก dvh: คำนวณความสูงเองแล้วอัปเดตตอนแถบเครื่องมือขยับ
      if (!(window.CSS && CSS.supports && CSS.supports('height', '100dvh'))) {
        var app = document.getElementById('app');
        var resize = function () {
          var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
          app.style.height = h + 'px';
        };
        resize();
        window.addEventListener('resize', resize, { passive: true });
        window.addEventListener('orientationchange', function () { setTimeout(resize, 250); });
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', resize, { passive: true });
        }
      }
    })();
  </script>
</body>
</html>
