<!DOCTYPE html>
<html lang="th"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ทดสอบโหลดรูป — น้องปันหา</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#F5F4F1;font-family:'Noto Sans Thai','Sarabun',-apple-system,'Segoe UI',sans-serif;
     color:#1E211F;padding:16px;max-width:560px;margin:0 auto}
h1{font-size:17px;color:#12535C;margin:0 0 4px}
p.s{font-size:12px;color:#73787A;line-height:1.7;margin:0 0 14px}
.sum{background:#FFFEFC;border:1px solid #E3E2DC;border-radius:12px;padding:13px 15px;margin-bottom:14px}
.sum b{font-size:15px}
.big{font-size:22px;font-weight:800;color:#12535C;display:block;margin:3px 0}
.row{background:#FFFEFC;border:1px solid #E3E2DC;border-radius:12px;padding:11px 13px;
     margin-bottom:9px;display:flex;align-items:center;gap:12px}
.row img{width:74px;height:auto;flex:none;background:#E4EDEF;border-radius:8px}
.row .i{flex:1;min-width:0;font-size:12px;line-height:1.6}
.row .i b{display:block;font-size:12.5px}
.st{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 10px;white-space:nowrap}
.ok{background:#E3F3E9;color:#1F7A4C}
.no{background:#FBE9E9;color:#A33}
.wait{background:#F5F4F1;color:#8A8F91}
.env{background:#FFFEFC;border:1px solid #E3E2DC;border-radius:12px;padding:12px 14px;
     font-size:11px;color:#6B7378;line-height:1.75;word-break:break-all;margin-top:6px}
.env b{color:#1E211F}
</style></head><body>

<h1>ทดสอบโหลดรูป — น้องปันหา</h1>
<p class="s">เปิดหน้านี้ <b>ผ่าน LINE บนเน็ตโรงพยาบาล</b> ถ้าทุกแถวขึ้น "โหลดได้" แปลว่าใช้วิธีเก็บรูปไว้ที่นี่ได้<br><b>img/</b> = รูปคาโรเซลวิธีใช้งาน (ตอนนี้ใส่ไว้ 3 ใบทดสอบ) · <b>app/</b> = รูปที่ย้ายออกจากไฟล์แอป 13 ไฟล์</p>

<div class="sum"><b>ผลรวม</b><span class="big" id="sum">กำลังทดสอบ…</span>
<span style="font-size:11.5px;color:#73787A" id="ms"></span></div>

<div id="list"></div>
<div class="env" id="env"></div>

<script>
var FILES=['img/panha-how-01.png','img/panha-how-02.png','img/panha-how-03.png',
           'app/gif-general.gif','app/gif-loading.gif','app/gif-success.gif','app/gif-empty.gif',
           'app/gif-error.gif','app/quick-empty.png','app/qfp-loading.png','app/quick-toast.png',
           'app/chonly-mascot.png','app/shared-0.png','app/mcard-btn.png','app/popup-moto.png',
           'app/popup-machine.png'];
var list=document.getElementById('list'), done=0, ok=0, t0=Date.now();
FILES.forEach(function(f,i){
  var el=document.createElement('div'); el.className='row';
  el.innerHTML='<img id="im'+i+'" alt=""><span class="i"><b>'+f+'</b>'+
    '<span id="d'+i+'" style="color:#8A8F91">กำลังโหลด…</span></span>'+
    '<span class="st wait" id="s'+i+'">รอ</span>';
  list.appendChild(el);
  var st=Date.now();
  var im=document.getElementById('im'+i);
  im.onload=function(){
    ok++; done++;
    document.getElementById('s'+i).className='st ok';
    document.getElementById('s'+i).textContent='โหลดได้';
    document.getElementById('d'+i).textContent=im.naturalWidth+'×'+im.naturalHeight+
      ' · '+(Date.now()-st)+' ms';
    finish();
  };
  im.onerror=function(){
    done++;
    document.getElementById('s'+i).className='st no';
    document.getElementById('s'+i).textContent='โหลดไม่ได้';
    document.getElementById('d'+i).textContent='ถูกบล็อก หรือหาไฟล์ไม่เจอ';
    finish();
  };
  im.src=f+'?t='+Date.now();
});
function finish(){
  if(done<FILES.length) return;
  var s=document.getElementById('sum');
  s.textContent = ok===FILES.length ? 'ผ่านทั้งหมด '+ok+'/'+FILES.length
                                    : 'ผ่าน '+ok+'/'+FILES.length+' — มีปัญหา';
  s.style.color = ok===FILES.length ? '#1F7A4C' : '#A33';
  document.getElementById('ms').textContent='ใช้เวลารวม '+(Date.now()-t0)+' ms';
}
document.getElementById('env').innerHTML=
  '<b>ที่อยู่หน้านี้</b><br>'+location.href+'<br><br>'+
  '<b>เบราว์เซอร์</b><br>'+navigator.userAgent;
</script>
</body></html>
